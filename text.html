<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Methodist Church - Kakuma Fellowship</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <!-- React and Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --ink: #050d17;
      --accent-dark: #0a1828;
      --accent: #d4af37;
      --panel: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--ink);
      color: var(--panel);
    }

    /* =========================
        NAVBAR
    ========================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      z-index: 1000;
      background: rgba(5, 13, 23, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.18);
      transition: background 0.3s ease;
    }

    .nav-container {
      max-width: 1400px;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--accent-dark);
      font-size: 16px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .logo-text strong {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .logo-text span {
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-dark) !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .nav-button:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.2);
    }

    .mobile-menu-button {
      display: none;
      border: none;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
    }

    /* =========================
        MOBILE MENU DRAWER
    ========================= */

    .mobile-menu {
      display: none;
      position: fixed;
      top: 70px;
      left: 0;
      width: 100%;
      background: rgba(5, 13, 23, 0.98);
      backdrop-filter: blur(16px);
      z-index: 999;
      padding: 24px 30px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(-10px);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      max-height: calc(100vh - 70px);
      overflow-y: auto;
    }

    .mobile-menu.active {
      display: flex;
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-menu a {
      color: white;
      text-decoration: none;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 500;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: color 0.2s ease;
    }

    .mobile-menu a:hover {
      color: var(--accent);
    }

    /* =========================
        HERO
    ========================= */

    .hero-section {
      background: linear-gradient(135deg, var(--accent-dark), var(--ink));
      overflow: hidden;
      position: relative;
      min-height: 100vh;
      width: 100%;
    }

    .hero-shell {
      min-height: 100vh;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      align-items: stretch;
      gap: 20px;
    }

    /* =========================
        HERO TEXT
    ========================= */

    .hero-intro {
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 120px 40px 60px 80px;
    }

    .hero-kicker {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-kicker::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: var(--accent);
    }

    .hero-intro h1 {
      margin: 0;
      color: var(--panel);
      font-size: clamp(2.5rem, 4.5vw, 4rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .hero-intro h1 span {
      display: block;
      color: var(--accent);
      margin-top: 6px;
    }

    .hero-copy {
      max-width: 480px;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 15px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 32px;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 24px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .hero-button-primary {
      background: linear-gradient(135deg, var(--accent), #b89325);
      color: var(--accent-dark);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .hero-button-secondary {
      color: var(--accent);
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(212, 175, 55, 0.03);
    }

    .hero-button:hover {
      transform: translateY(-2px);
    }

    .hero-button-primary:hover {
      background: white;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
    }

    .hero-button-secondary:hover {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--accent);
    }

    /* =========================
        IMAGE GALLERY
    ========================= */

    .hero-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      height: 100vh;
      overflow: hidden;
      padding: 0 20px 0 0;
    }

    .hero-gallery-column {
      position: relative;
      overflow: hidden;
    }

    .imageSlider {
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideTopToBottom 32s linear infinite;
      will-change: transform;
    }

    .hero-gallery-column:nth-child(2) .imageSlider {
      animation-duration: 38s;
      animation-direction: reverse;
    }

    .hero-gallery-column:nth-child(3) .imageSlider {
      animation-duration: 35s;
    }

    @keyframes slideTopToBottom {
      0% {
        transform: translateY(-50%);
      }
      100% {
        transform: translateY(0);
      }
    }

    .hero-image-card {
      width: 100%;
      height: 320px;
      flex: 0 0 320px;
      overflow: hidden;
      background: #101b29;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .hero-image-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-image-card:hover img {
      transform: scale(1.08);
    }

    /* Dark overlays for framing */
    .hero-gallery-column::before,
    .hero-gallery-column::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 120px;
      z-index: 2;
      pointer-events: none;
    }

    .hero-gallery-column::before {
      top: 0;
      background: linear-gradient(to bottom, var(--ink), transparent);
    }

    .hero-gallery-column::after {
      bottom: 0;
      background: linear-gradient(to top, var(--ink), transparent);
    }

    /* =========================
        RESPONSIVE DESIGN
    ========================= */

    @media (max-width: 1200px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a {
        font-size: 12px;
      }
    }

    @media (max-width: 1024px) {
      .nav-container {
        padding: 0 24px;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-button {
        display: block;
      }

      .hero-shell {
        grid-template-columns: 1fr;
        padding-top: 70px;
      }

      .hero-intro {
        padding: 60px 24px 30px;
        align-items: center;
        text-align: center;
      }

      .hero-kicker {
        justify-content: center;
      }

      .hero-kicker::before {
        display: none;
      }

      .hero-copy {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-actions {
        justify-content: center;
      }

      .hero-gallery {
        height: 50vh;
        min-height: 350px;
        padding: 0 16px 20px 16px;
      }

      .hero-image-card {
        height: 220px;
        flex: 0 0 220px;
      }
    }

    @media (max-width: 768px) {
      .hero-intro {
        padding: 40px 20px 20px;
      }

      .hero-intro h1 {
        font-size: 2.3rem;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- React Application Scripts -->
  <script type="text/babel">
    function App() {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

      const toggleMenu = () => {
        setIsMobileMenuOpen(!isMobileMenuOpen);
      };

      React.useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth > 1024) {
            setIsMobileMenuOpen(false);
          }
        };
        window.addEventListener("resize", handleResize);
        return () => window.removeEventListener("resize", handleResize);
      }, []);

      const navItems = [
        { label: "Home", href: "#" },
        { label: "About", href: "#" },
        { label: "Services", href: "#" },
        { label: "Events", href: "#" },
        { label: "Sermons", href: "#" },
        { label: "Ministries", href: "#" },
        { label: "Give", href: "#" },
        { label: "Resources", href: "#" },
        { label: "Contact", href: "#" },
      ];

      return (
        <div>
          {/* =========================
                NAVBAR
          ========================= */}
          <header className="navbar">
            <div className="nav-container">
              <a href="#" className="nav-logo">
                <div className="logo-icon">
                  <i className="fas fa-cross"></i>
                </div>
                <div className="logo-text">
                  <strong>METHODIST CHURCH</strong>
                  <span>KAKUMA FELLOWSHIP</span>
                </div>
              </a>

              <nav className="nav-links">
                {navItems.map((item, index) => (
                  <a key={index} href={item.href}>{item.label}</a>
                ))}
                <a href="#" className="nav-button">Prayer Request</a>
              </nav>

              <button 
                className="mobile-menu-button" 
                onClick={toggleMenu} 
                aria-label="Toggle Menu"
              >
                <i className={`fas ${isMobileMenuOpen ? 'fa-xmark' : 'fa-bars'}`}></i>
              </button>
            </div>
          </header>

          {/* =========================
                MOBILE MENU DRAWER
          ========================= */}
          <div id="mobileMenu" className={`mobile-menu ${isMobileMenuOpen ? 'active' : ''}`}>
            {navItems.map((item, index) => (
              <a key={index} href={item.href} onClick={() => setIsMobileMenuOpen(false)}>
                {item.label}
              </a>
            ))}
            <a 
              href="#" 
              className="nav-button" 
              style={{ textAlign: 'center', marginTop: '8px' }}
              onClick={() => setIsMobileMenuOpen(false)}
            >
              Prayer Request
            </a>
          </div>

          {/* =========================
                HERO SECTION
          ========================= */}
          <main>
            <section className="hero-section">
              <div className="hero-shell">

                {/* HERO TEXT */}
                <div className="hero-intro">
                  <div className="hero-kicker">
                    Kakuma Fellowship
                  </div>
                  <h1>
                    Methodist Church
                    <span>Kakuma Fellowship</span>
                  </h1>
                  <p className="hero-copy">
                    A welcoming community of faith, worship, and fellowship. Join us as we grow together in Christ, support one another, and serve our community with love and hope.
                  </p>
                  <div className="hero-actions">
                    <a href="#" className="hero-button hero-button-primary">
                      <i className="fas fa-church mr-2"></i>
                      Find a Church
                    </a>
                    <a href="#" className="hero-button hero-button-secondary">
                      Learn More
                      <i className="fas fa-arrow-right ml-2"></i>
                    </a>
                  </div>
                </div>

                {/* IMAGE GALLERY */}
                <div className="hero-gallery">

                  {/* COLUMN 1 */}
                  <div className="hero-gallery-column">
                    <div className="imageSlider">
                      {/* Set 1 */}
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=800&q=85" alt="Church fellowship" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1507692049790-de58290a4334?auto=format&fit=crop&w=800&q=85" alt="Worship" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=800&q=85" alt="Community" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&w=800&q=85" alt="Bible" /></div>
                      {/* Duplicate Set */}
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=800&q=85" alt="Church fellowship" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1507692049790-de58290a4334?auto=format&fit=crop&w=800&q=85" alt="Worship" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=800&q=85" alt="Community" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&w=800&q=85" alt="Bible" /></div>
                    </div>
                  </div>

                  {/* COLUMN 2 */}
                  <div className="hero-gallery-column">
                    <div className="imageSlider">
                      {/* Set 1 */}
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=800&q=85" alt="Fellowship" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?auto=format&fit=crop&w=800&q=85" alt="Community" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1529070538774-1843cb3265df?auto=format&fit=crop&w=800&q=85" alt="Church group" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1544427920-c49ccfb85579?auto=format&fit=crop&w=800&q=85" alt="Worship community" /></div>
                      {/* Duplicate Set */}
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=800&q=85" alt="Fellowship" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?auto=format&fit=crop&w=800&q=85" alt="Community" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1529070538774-1843cb3265df?auto=format&fit=crop&w=800&q=85" alt="Church group" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1544427920-c49ccfb85579?auto=format&fit=crop&w=800&q=85" alt="Worship community" /></div>
                    </div>
                  </div>

                  {/* COLUMN 3 */}
                  <div className="hero-gallery-column">
                    <div className="imageSlider">
                      {/* Set 1 */}
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1529390079861-591de354faf5?auto=format&fit=crop&w=800&q=85" alt="Youth" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=800&q=85" alt="Training" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1515169067868-5387ec356754?auto=format&fit=crop&w=800&q=85" alt="Gathering" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=800&q=85" alt="Fellowship" /></div>
                      {/* Duplicate Set */}
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1529390079861-591de354faf5?auto=format&fit=crop&w=800&q=85" alt="Youth" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=800&q=85" alt="Training" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1515169067868-5387ec356754?auto=format&fit=crop&w=800&q=85" alt="Gathering" /></div>
                      <div className="hero-image-card"><img src="https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=800&q=85" alt="Fellowship" /></div>
                    </div>
                  </div>

                </div>

              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
